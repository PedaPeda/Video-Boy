# Publishes a GitHub release when a version tag (v1.2.3) is pushed.
# Attaches the Linux packages from linux/dist/ and the web app as video-boy.html,
# so GitHub counts the downloads.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          cp web/index.html video-boy.html
          sed "s/VERSION/$V/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Video Boy $V" --notes-file notes.md \
            "linux/dist/video-boy_${V}_all.deb" "linux/dist/video-boy-${V}-linux.tar.gz" video-boy.html
